<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#efe4d6;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#d97a4a}
  a:hover{color:#c15f30}
  ::-webkit-scrollbar{display:none}
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px">
<x-import component-from-global-scope="AndroidDevice" from="./android-frame.jsx" width="{{ 412 }}" height="{{ 892 }}" dark="{{ false }}" hint-size="412px,892px">

<div style="height:100%;display:flex;flex-direction:column;background:#faf3ea">

  <div style="flex:1;overflow-y:auto;padding-bottom:8px">

    <div style="padding:20px 22px 4px">
      <div style="font:400 13px/1.3 'Inter';color:#8a9a7e;letter-spacing:.03em;text-transform:uppercase">Profile</div>
      <div style="font:700 27px/1.25 'Kalam',cursive;color:#3a2b22;margin-top:4px">Mia Alvarez</div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;margin:18px 22px 0">
      <div style="width:56px;height:56px;border-radius:50%;background:#ecdfc9;flex-shrink:0"></div>
      <div>
        <div style="font:700 15px/1.3 'Kalam',cursive;color:#3a2b22">mia.alvarez@email.com</div>
        <div style="font:400 12px/1.4 'Inter';color:#a3947f;margin-top:2px">Piano · joined Jun 2026</div>
      </div>
    </div>

    <sc-if value="{{ isPro }}" hint-placeholder-val="{{ false }}">
      <div style="margin:20px 20px 0;border-radius:20px;background:linear-gradient(150deg,#d97a4a,#c15f30);padding:20px;box-shadow:0 6px 16px rgba(193,95,48,.28)">
        <div style="font:600 11px/1 'Inter';letter-spacing:.1em;color:rgba(255,255,255,.7);text-transform:uppercase">Your plan</div>
        <div style="font:700 22px/1.3 'Kalam',cursive;color:#fff;margin-top:8px">MusicLab Pro</div>
        <div style="font:400 13px/1.4 'Inter';color:rgba(255,255,255,.75);margin-top:2px">Renews Sep 14, 2026</div>
        <button style="margin-top:16px;background:#fff;color:#c15f30;border:none;border-radius:100px;padding:10px 20px;font:600 13px/1 'Inter';cursor:pointer" onClick="{{ noop }}">Manage subscription</button>
      </div>
    </sc-if>
    <sc-if value="{{ !isPro }}" hint-placeholder-val="{{ true }}">
      <div style="margin:20px 20px 0;border-radius:20px;background:#fff;border:2px solid #ecdfc9;padding:20px">
        <div style="font:600 11px/1 'Inter';letter-spacing:.1em;color:#d97a4a;text-transform:uppercase">Your plan</div>
        <div style="font:700 22px/1.3 'Kalam',cursive;color:#3a2b22;margin-top:8px">Free</div>
        <div style="font:400 13px/1.4 'Inter';color:#8a7a6d;margin-top:2px">Upgrade for unlimited pieces, full analysis, and recording history</div>
        <button style="margin-top:16px;background:#d97a4a;color:#fff;border:none;border-radius:100px;padding:11px 22px;font:600 14px/1 'Inter';cursor:pointer" style-hover="background:#c15f30" onClick="{{ noop }}">Upgrade to Pro →</button>
      </div>
    </sc-if>

    <div style="margin:24px 20px 0;background:#fff;border:2px solid #ecdfc9;border-radius:16px;overflow:hidden">
      <sc-for list="{{ menuItems }}" as="m" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:{{ m.border }};cursor:pointer" onClick="{{ noop }}">
          <div style="width:34px;height:34px;border-radius:10px;background:#f2ece1;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <div style="{{ m.iconStyle }}"></div>
          </div>
          <div style="flex:1;font:600 14px/1 'Inter';color:#3a2b22">{{ m.label }}</div>
          <div style="width:7px;height:7px;border-top:2px solid #b0a494;border-right:2px solid #b0a494;transform:rotate(45deg)"></div>
        </div>
      </sc-for>
    </div>

  </div>

  <div style="display:flex;border-top:1px solid rgba(58,43,34,.1);background:#fff;padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 6px)">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;cursor:pointer" onClick="{{ t.onSelect }}">
        <div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center">
          <div style="{{ t.iconStyle }}"></div>
        </div>
        <div style="font:{{ t.labelWeight }} 11px/1 'Inter';color:{{ t.labelColor }};border-bottom:{{ t.underline }};padding-bottom:2px">{{ t.name }}</div>
      </div>
    </sc-for>
  </div>

</div>

</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:508,&quot;height&quot;:988},&quot;isPro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Subscription&quot;}}">
class Component extends DCLogic {
  state = { activeTab: 'profile' };

  renderVals() {
    const activeTab = this.state.activeTab;
    const isPro = this.props.isPro ?? false;
    const noop = () => {};

    const menuItems = [
      { label: 'Restore purchases', iconStyle: 'width:14px;height:14px;border-radius:50%;border:2px solid #d97a4a;box-sizing:border-box', border: '1px solid #ecdfc9' },
      { label: 'Manage subscription', iconStyle: 'width:14px;height:14px;border-radius:4px;background:#d97a4a', border: '1px solid #ecdfc9' },
      { label: 'Sign out', iconStyle: 'width:14px;height:2px;background:#d97a4a', border: 'none' },
    ];

    const tabDefs = [
      { key: 'home', name: 'Home' },
      { key: 'library', name: 'Library' },
      { key: 'journey', name: 'Journey' },
      { key: 'profile', name: 'Profile' },
    ];
    const tabs = tabDefs.map(t => {
      const isActive = t.key === activeTab;
      const color = isActive ? '#d97a4a' : '#b0a494';
      let icon;
      if (t.key === 'home') icon = `width:16px;height:16px;border-radius:4px;background:${color}`;
      else if (t.key === 'library') icon = `width:15px;height:16px;border-left:3px solid ${color};border-right:3px solid ${color};box-sizing:border-box`;
      else if (t.key === 'journey') icon = `width:16px;height:16px;border-radius:50%;border:2px solid ${color};box-sizing:border-box`;
      else icon = `width:14px;height:14px;border-radius:50%;background:${color}`;
      return {
        name: t.name,
        iconStyle: icon,
        labelColor: color,
        labelWeight: isActive ? 600 : 500,
        underline: isActive ? '2px dashed #d97a4a' : '2px solid transparent',
        onSelect: () => this.setState({ activeTab: t.key }),
      };
    });

    return { isPro, noop, menuItems, tabs };
  }
}

</script>
</body>
</html>
